name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      SWIFT_TOOLCHAIN: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-17-a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Swift toolchain
        run: |
          set -o pipefail
          url="https://download.swift.org/swift-6.4.x-branch/xcode/${SWIFT_TOOLCHAIN}/${SWIFT_TOOLCHAIN}-osx.pkg"
          curl -fSL "$url" -o toolchain.pkg
          sudo installer -pkg toolchain.pkg -target /
          toolchain="/Library/Developer/Toolchains/${SWIFT_TOOLCHAIN}.xctoolchain"
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$toolchain/Info.plist")" >> "$GITHUB_ENV"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Build DocC static site
        env:
          SWIFTPY_BUILD_DOCS: "1"
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target SwiftPy \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path SwiftPy \
            --output-path ./docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # pocketpy is the only backend a fresh checkout can build: the cpython
      # default needs a libpython staged locally by that package's build.sh.
      - name: Run tests
        run: swift test --traits pocketpy --enable-code-coverage

      - name: Export coverage (lcov)
        run: |
          PROFDATA=$(swift test --traits pocketpy --show-codecov-path | sed 's|/codecov/.*|/codecov/default.profdata|')
          BIN=$(find .build -name 'SwiftPyPackageTests.xctest' | head -1)/Contents/MacOS/SwiftPyPackageTests
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$PROFDATA" "$BIN" \
            -ignore-filename-regex='(Tests|\.build|checkouts|pocketpy)/' \
            > coverage.lcov
          echo "lcov lines: $(wc -l < coverage.lcov)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
